{% extends "base.html" %}

{% block title %}Новое сообщение — Digital Student Assistant{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="{% url 'messaging:thread_list' %}"
       class="p-2 rounded-lg text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-colors"
       aria-label="Назад к списку сообщений">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
           aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <h1 class="text-xl font-semibold text-gray-900">Новое сообщение</h1>
  </div>

  <form method="post"
        class="bg-white border border-gray-500 rounded-xl p-6 space-y-5"
        novalidate>
    {% csrf_token %}

    <div>
      <label for="recipient" class="block text-sm font-medium text-gray-700 mb-1">
        Получатель <span class="text-red-600" aria-hidden="true">*</span>
      </label>
      <select id="recipient" name="recipient" required aria-required="true"
              class="w-full px-3 py-2 text-sm border border-gray-500 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors">
        <option value="">— Выберите пользователя —</option>
        {% for u in users %}
          <option value="{{ u.pk }}">
            {{ u.get_full_name|default:u.username }} ({{ u.email }})
          </option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">
        Тема <span class="text-red-600" aria-hidden="true">*</span>
      </label>
      <input id="subject" type="text" name="subject" required aria-required="true"
             placeholder="Тема сообщения"
             class="w-full px-3 py-2 text-sm border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors">
    </div>

    <div>
      <label for="body" class="block text-sm font-medium text-gray-700 mb-1">
        Сообщение <span class="text-red-600" aria-hidden="true">*</span>
      </label>
      <textarea id="body" name="body" rows="5" required aria-required="true"
                placeholder="Введите текст сообщения..."
                class="w-full px-3 py-2 text-sm border border-gray-500 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"></textarea>
    </div>

    <div class="flex justify-end">
      <button type="submit"
              class="px-5 py-2 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors">
        Отправить
      </button>
    </div>
  </form>
</div>
{% endblock %}
