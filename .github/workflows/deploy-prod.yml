name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push-image:
    name: Build and push production web image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      target_sha: ${{ steps.meta.outputs.target_sha }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
      target_ref: ${{ steps.meta.outputs.target_ref }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Compute image metadata
        id: meta
        run: |
          owner_lc="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo_lc="$(printf '%s' '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "target_ref=${{ github.event.inputs.ref || github.sha }}" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/${owner_lc}/${repo_lc}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: src/web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image_prefix }}-web:${{ steps.meta.outputs.target_sha }}
            ${{ steps.meta.outputs.image_prefix }}-web:main-latest

  deploy:
    name: Deploy over SSH
    needs: build-and-push-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy and smoke-check on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          command_timeout: 40m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.PROD_APP_DIR }}"
            TARGET_REF="${{ needs.build-and-push-image.outputs.target_ref }}"
            TARGET_SHA="${{ needs.build-and-push-image.outputs.target_sha }}"
            IMAGE_PREFIX="${{ needs.build-and-push-image.outputs.image_prefix }}"
            PUBLIC_HOST="${{ secrets.PROD_PUBLIC_HOST || secrets.PROD_SSH_HOST }}"
            PUBLIC_BASE_URL="${{ secrets.PROD_PUBLIC_BASE_URL || '' }}"
            if [ -z "$PUBLIC_BASE_URL" ]; then
              PUBLIC_BASE_URL="http://${PUBLIC_HOST}"
            fi
            PUBLIC_SCHEME="$(printf '%s' "$PUBLIC_BASE_URL" | sed -E 's#^(https?)://.*#\1#')"
            compose_cmd=(docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod)

            cd "$APP_DIR"

            git_safe() {
              git -c fetch.recurseSubmodules=false -c submodule.recurse=false "$@"
            }

            cleanup_deploy_only_submodules() {
              local path
              for path in "docs/technical-specification/technical-specification-3"; do
                rm -rf "$path" ".git/modules/$path"
                git config --local --remove-section "submodule.$path" >/dev/null 2>&1 || true
              done
            }

            cleanup_deploy_only_submodules

            git_safe fetch --all --prune --tags --no-recurse-submodules
            if ! git_safe diff --quiet --ignore-submodules -- || ! git_safe diff --cached --quiet --ignore-submodules --; then
              echo "Discarding tracked local changes in deploy worktree"
              git_safe reset --hard HEAD
            fi
            if git_safe show-ref --verify --quiet "refs/remotes/origin/$TARGET_REF"; then
              git_safe checkout -B "$TARGET_REF" "origin/$TARGET_REF"
              git_safe pull --ff-only --no-recurse-submodules origin "$TARGET_REF"
            else
              git_safe checkout --detach "$TARGET_REF"
            fi
            cleanup_deploy_only_submodules

            ACTUAL_SHA="$(git_safe rev-parse HEAD)"
            if [ "$ACTUAL_SHA" != "$TARGET_SHA" ]; then
              echo "Ref mismatch: expected $TARGET_SHA, got $ACTUAL_SHA" >&2
              exit 1
            fi

            if [ ! -f infra/.env.prod ]; then
              cp infra/.env.prod.example infra/.env.prod
              chmod 600 infra/.env.prod
            fi

            get_env_val() {
              local key="$1"
              grep -E "^${key}=" infra/.env.prod | tail -n1 | cut -d= -f2- || true
            }

            is_placeholder() {
              local value="${1:-}"
              [[ -z "$value" || "$value" =~ (replace|change-me|placeholder|example\.com) ]]
            }

            set_env_key() {
              local key="$1"
              local value="$2"
              if grep -qE "^${key}=" infra/.env.prod; then
                sed -i "s|^${key}=.*|${key}=${value}|" infra/.env.prod
              else
                printf "%s=%s\n" "$key" "$value" >> infra/.env.prod
              fi
            }

            replace_if_placeholder() {
              local key="$1"
              local candidate="$2"
              local current
              current="$(get_env_val "$key")"
              if is_placeholder "$current"; then
                set_env_key "$key" "$candidate"
              fi
            }

            require_stable_env_for_existing_volume() {
              local volume_name="$1"
              shift
              if ! docker volume inspect "$volume_name" >/dev/null 2>&1; then
                return 0
              fi
              for key in "$@"; do
                local current
                current="$(get_env_val "$key")"
                if is_placeholder "$current"; then
                  echo "::error::Existing Docker volume $volume_name found, but $key is missing or still a placeholder in infra/.env.prod." >&2
                  echo "::error::Refusing to generate a new credential because it would not update the existing database role password." >&2
                  exit 1
                fi
              done
            }

            DJ_SECRET="$(python3 - <<'PY'
            import secrets
            print(secrets.token_urlsafe(64))
            PY
            )"
            PG_PASS="$(openssl rand -hex 20)"

            require_stable_env_for_existing_volume \
              "infra_postgres-prod" \
              POSTGRES_DB \
              POSTGRES_USER \
              POSTGRES_PASSWORD \
              DATABASE_URL

            replace_if_placeholder "DJANGO_SECRET_KEY" "$DJ_SECRET"
            replace_if_placeholder "POSTGRES_PASSWORD" "$PG_PASS"

            POSTGRES_DB_VAL="$(get_env_val POSTGRES_DB)"
            POSTGRES_USER_VAL="$(get_env_val POSTGRES_USER)"
            POSTGRES_PASS_VAL="$(get_env_val POSTGRES_PASSWORD)"
            if [ -z "$POSTGRES_DB_VAL" ]; then
              POSTGRES_DB_VAL="dsa"
              set_env_key "POSTGRES_DB" "$POSTGRES_DB_VAL"
            fi
            if [ -z "$POSTGRES_USER_VAL" ]; then
              POSTGRES_USER_VAL="dsa"
              set_env_key "POSTGRES_USER" "$POSTGRES_USER_VAL"
            fi
            if is_placeholder "$POSTGRES_PASS_VAL"; then
              POSTGRES_PASS_VAL="$PG_PASS"
              set_env_key "POSTGRES_PASSWORD" "$POSTGRES_PASS_VAL"
            fi

            DATABASE_URL_VAL="$(get_env_val DATABASE_URL)"
            if is_placeholder "$DATABASE_URL_VAL"; then
              set_env_key "DATABASE_URL" "postgresql+psycopg2://${POSTGRES_USER_VAL}:${POSTGRES_PASS_VAL}@postgres:5432/${POSTGRES_DB_VAL}"
            fi

            set_env_key "ML_SERVICE_URL" ""
            set_env_key "DJANGO_ALLOWED_HOSTS" "$PUBLIC_HOST,localhost,127.0.0.1,web"
            set_env_key "DJANGO_CSRF_TRUSTED_ORIGINS" "$PUBLIC_BASE_URL,http://$PUBLIC_HOST,http://localhost,http://127.0.0.1"
            if [ "$PUBLIC_SCHEME" = "https" ]; then
              set_env_key "DJANGO_SECURE_SSL_REDIRECT" "true"
              set_env_key "DJANGO_SESSION_COOKIE_SECURE" "true"
              set_env_key "DJANGO_CSRF_COOKIE_SECURE" "true"
            else
              set_env_key "DJANGO_SECURE_SSL_REDIRECT" "false"
              set_env_key "DJANGO_SESSION_COOKIE_SECURE" "false"
              set_env_key "DJANGO_CSRF_COOKIE_SECURE" "false"
            fi

            dump_compose_diagnostics() {
              local status="$1"
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              trap - EXIT
              echo "Deploy failed; collecting docker compose diagnostics..." >&2
              "${compose_cmd[@]}" ps || true
              for service in postgres web nginx; do
                echo "--- docker compose logs: ${service} ---" >&2
                "${compose_cmd[@]}" logs --tail 200 "$service" || true
              done
              exit "$status"
            }
            trap 'dump_compose_diagnostics $?' EXIT

            set_env_key "NGINX_PUBLIC_HOST" "$PUBLIC_HOST"

            if [ "$PUBLIC_SCHEME" = "https" ]; then
              if ! sudo -n test -r "/etc/letsencrypt/live/${PUBLIC_HOST}/fullchain.pem" ||
                ! sudo -n test -r "/etc/letsencrypt/live/${PUBLIC_HOST}/privkey.pem"; then
                echo "::error::Missing TLS certificate for ${PUBLIC_HOST}." >&2
                echo "::error::Run certbot on the production VM before deploying HTTPS." >&2
                exit 1
              fi
              set_env_key "NGINX_CONF_TEMPLATE" "./nginx/templates/default.https.conf.template"
            else
              set_env_key "NGINX_CONF_TEMPLATE" "./nginx/templates/default.http.conf.template"
            fi

            WEB_IMAGE="${IMAGE_PREFIX}-web:${TARGET_SHA}"

            pull_web_image() {
              local attempt
              for attempt in 1 2 3; do
                if WEB_IMAGE="$WEB_IMAGE" "${compose_cmd[@]}" pull web; then
                  return 0
                fi
                echo "web image pull attempt ${attempt} failed" >&2
                sleep $((attempt * 10))
              done
              return 1
            }

            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            pull_web_image

            WEB_IMAGE="$WEB_IMAGE" \
            "${compose_cmd[@]}" up -d --no-build --remove-orphans --force-recreate --wait --wait-timeout 240
            docker logout ghcr.io || true

            SMOKE_HOST="$(printf '%s' "$PUBLIC_BASE_URL" | sed -E 's#^https?://([^/:]+).*$#\1#')"
            SMOKE_PORT="$(printf '%s' "$PUBLIC_BASE_URL" | sed -nE 's#^https?://[^/:]+:([0-9]+).*$#\1#p')"
            if [ -z "$SMOKE_PORT" ]; then
              if [ "$PUBLIC_SCHEME" = "https" ]; then
                SMOKE_PORT="443"
              else
                SMOKE_PORT="80"
              fi
            fi
            if [ "$SMOKE_HOST" = "$PUBLIC_BASE_URL" ] || [ -z "$SMOKE_HOST" ]; then
              SMOKE_BASE_URL="http://127.0.0.1"
              SMOKE_CURL_OPTS=""
            else
              SMOKE_BASE_URL="$PUBLIC_BASE_URL"
              SMOKE_CURL_OPTS="--resolve ${SMOKE_HOST}:${SMOKE_PORT}:127.0.0.1"
              if [ "$PUBLIC_SCHEME" = "https" ]; then
                SMOKE_CURL_OPTS="$SMOKE_CURL_OPTS -k"
              fi
            fi

            ENV_FILE=infra/.env.prod \
            COMPOSE_FILE=infra/docker-compose.prod.yml \
            PUBLIC_BASE_URL="$SMOKE_BASE_URL" \
            PUBLIC_CURL_OPTS="$SMOKE_CURL_OPTS" \
            scripts/smoke-prod.sh
